[package]
name = "lpcli"
version = "0.2.0"
edition = "2024"
description = "A command-line client for Launchpad.net"
license = "GPL-3.0-or-later"
repository = "https://github.com/canonical/lpcli"
keywords = ["launchpad", "ubuntu", "cli", "packaging"]
categories = ["command-line-utilities"]
rust-version = "1.93"

[[bin]]
name = "lpcli"
path = "src/bin/lpcli.rs"

[lib]
name = "lpcli"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "cookies", "form", "stream", "multipart"] }

# Async stream utilities
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# OAuth nonce generation
rand = "0.10"
hex = "0.4"

# OS keyring (Secret Service / Keychain / Credential Manager)
keyring-core = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration / credential storage
dirs = "7"
toml = "1.0"

# URL handling
url = { version = "2", features = ["serde"] }
percent-encoding = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Ubuntu distribution information (series, pockets, components, architectures)
ubuntu-info-rust = "0.3"

# MIME type detection for file uploads
mime_guess = "2"

# Pretty terminal output
colored = "3"
comfy-table = "8"
indicatif = "0.18"
unit-prefix = "0.5.2"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus Secret Service backend.  This deliberately avoids the zbus-based
# backend, whose zbus 5 dependency pulls in the unmaintained `zvariant`,
# `zbus_names`, and `zvariant_derive` crates (RUSTSEC-2026-0370/0371/0372).
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
dirs = "7"
tempfile = "3"


[package]
name = "lpcli"
version = "0.5.2"
edition = "2024"
description = "A command-line client for Launchpad.net"
license = "GPL-3.0-or-later"
repository = "https://github.com/canonical/lpcli"
keywords = ["launchpad", "ubuntu", "cli", "packaging"]
categories = ["command-line-utilities"]
rust-version = "1.97"

[[bin]]
name = "lpcli"
path = "src/bin/lpcli.rs"
required-features = ["auth"]

[lib]
name = "lpcli"
path = "src/lib.rs"

[features]
default = ["auth"]
auth = [
    "dep:aes",
    "dep:apple-native-keyring-store",
    "dep:base64",
    "dep:cbc",
    "dep:ciborium",
    "dep:dbus-secret-service-keyring-store",
    "dep:dirs",
    "dep:hex",
    "dep:hkdf",
    "dep:hmac",
    "dep:keyring-core",
    "dep:libc",
    "dep:nix",
    "dep:p256",
    "dep:rand",
    "dep:rpassword",
    "dep:sha2",
    "dep:windows-native-keyring-store",
    "dep:zeroize",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "cookies", "form", "stream", "multipart"] }

# Async stream utilities
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# OAuth nonce generation
rand = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

# OS keyring (Secret Service / Keychain / Credential Manager)
keyring-core = { version = "1", optional = true }

# Hardware-bound API tokens: WebAuthn base64url encoding, CTAP2 CBOR messages,
# and the CTAP2 PIN/UV auth protocols (ECDH P-256, AES-256-CBC, HMAC/HKDF-SHA-256).
base64 = { version = "0.23", optional = true }
ciborium = { version = "0.2", optional = true }
# p256 0.14 (elliptic-curve 0.14) is required for crypto-bigint >= 0.7.6,
# which fixes RUSTSEC-2026-0387.  Only ECDH is needed, so ECDSA/PEM are off.
p256 = { version = "0.14", default-features = false, features = ["ecdh"], optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true }
hmac = { version = "0.13", optional = true }
hkdf = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
zeroize = { version = "1", optional = true }

# No-echo terminal prompts for security-key PINs and grant secrets
rpassword = { version = "7", optional = true }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration / credential storage
dirs = { version = "7", optional = true }
toml = "1.0"

# URL handling
url = { version = ">=2.5.9", features = ["serde"] }
percent-encoding = "2"

# Time
jiff = { version = "1.0.0", features = ["serde"] }
# RFC 9110 HTTP-date parsing for Retry-After (including legacy date formats)
httpdate = "1"

# Ubuntu distribution information (series, pockets, components, architectures)
ubuntu-info-rust = "0.3"

# MIME type detection for file uploads
mime_guess = "2"

# Pretty terminal output
# Explicit ANSI styles for the output layer (already used by clap)
anstyle = "1.0.14"
comfy-table = "8"
indicatif = "0.18"
unit-prefix = "0.5.2"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus Secret Service backend.  This deliberately avoids the zbus-based
# backend, whose zbus 5 dependency pulls in the unmaintained `zvariant`,
# `zbus_names`, and `zvariant_derive` crates (RUSTSEC-2026-0370/0371/0372).
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"], optional = true }
# Non-blocking hidraw access for USB FIDO2 security keys
libc = { version = "0.2", optional = true }
# Safe getpwuid_r wrapper for environment-independent cache coordination paths
nix = { version = "0.32", default-features = false, features = ["user"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[dev-dependencies]
# Deterministic timer tests without real retry delays
tokio = { version = "1", features = ["test-util"] }
tokio-test = "0.4"
mockito = "1"
dirs = "7"
tempfile = "3"
# Parse documented shell examples without executing them
shlex = "2.0.1"
# Snapshot tests for the output modes (snapshots live next to their tests)
insta = { version = "1.49.0", features = ["json", "redactions"] }

